<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c5ce7">
<title>QPay — Нет соединения</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f2f8;color:#1a1a2e;font-family:Inter,Arial,sans-serif;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid #eef2f8;border-radius:28px;padding:36px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.08)}
.logo{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:#6c5ce7;display:grid;place-items:center;color:#fff;font-size:38px;font-weight:800}
h1{margin:0 0 10px;font-size:25px}p{margin:0 0 24px;color:#7a7a9a;line-height:1.55}
button{border:0;border-radius:40px;background:#6c5ce7;color:#fff;padding:13px 24px;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<div class="logo">Q</div>
<h1>Нет подключения</h1>
<p>Сейчас интернет недоступен. QPay сохранит локальное состояние приложения и вернётся к работе после восстановления соединения.</p>
<button onclick="location.href='./index.html'">Вернуться в приложение</button>
</main>
</body>
</html>
